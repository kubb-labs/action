name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version packages
    if: github.repository_owner == 'kubb-labs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: kubb-labs/config/.github/setup@ec40df0e3e54565e006f6d92a2fce16ff43b14d8 # main
        with:
          node-version: '22.22.3'
          cache: 'false'
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          commit-message: 'ci(changesets): version packages'
          pr-title: 'ci(changesets): version packages'
          create-github-releases: false
          push-git-tags: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether this version needs a release
        id: release
        env:
          HAS_CHANGESETS: ${{ steps.changesets.outputs.has-changesets }}
        run: |
          if [ "$HAS_CHANGESETS" = 'true' ]; then
            exit 0
          fi
          tag="v$(node -p "require('./package.json').version")"
          git fetch --tags origin
          if git rev-parse "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"

  tag:
    name: Build and tag release
    needs: [version]
    if: github.repository_owner == 'kubb-labs' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: kubb-labs/config/.github/setup@ec40df0e3e54565e006f6d92a2fce16ff43b14d8 # main
        with:
          node-version: '22.22.3'
          cache: 'false'
      - name: Tag the version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          git fetch --tags origin
          if git rev-parse "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          major="v${version%%.*}"
          git tag -f "$major"
          git push --force origin "$major"
          gh release create "$tag" --title "$tag" --generate-notes
