name: Kubb snapshot
description: Generate and publish a Kubb snapshot from GitHub Actions
author: Kubb Labs
branding:
  icon: package
  color: blue
inputs:
  token:
    description: Kubb Studio CI token
    required: true
  github-token:
    description: GitHub token used to open the initialization pull request and update the snapshot comment
    default: ${{ github.token }}
    required: false
  working-directory:
    description: Directory containing the Kubb configuration and package
    default: .
    required: false
  config:
    description: Path to the Kubb config file, relative to working-directory
    default: kubb.config.ts
    required: false
outputs:
  snapshot-id:
    description: ID of the generated snapshot
  package-name:
    description: Generated package name
  package-version:
    description: Generated package version
  tarball-url:
    description: URL of the generated package tarball
  integrity:
    description: SHA-512 integrity of the generated tarball
  agent-url:
    description: Kubb Studio agent URL
  files-added:
    description: Number of generated files added since the previous snapshot on this pull request
  files-changed:
    description: Number of generated files changed since the previous snapshot on this pull request
  files-removed:
    description: Number of generated files removed since the previous snapshot on this pull request
runs:
  using: node24
  main: dist/index.js
