name: Kubb snapshot
description: Generate and publish a Kubb snapshot from GitHub Actions
author: Kubb Labs
branding:
  icon: package
  color: blue
inputs:
  token:
    description: Kubb Studio CI token
    required: true
  github-token:
    description: GitHub token used to open the initialization pull request and update the snapshot comment
    default: ${{ github.token }}
    required: false
  working-directory:
    description: Directory containing the Kubb configuration and package
    default: .
    required: false
  config:
    description: Path to the Kubb config file, relative to working-directory
    default: kubb.config.ts
    required: false
  publish:
    description: Publish the generated snapshot to npm
    default: 'false'
    required: false
  snapshot-id:
    description: Existing Kubb Studio snapshot ID to publish instead of generating a snapshot
    required: false
  npm-token:
    description: npm access token used when publishing
    required: false
  registry:
    description: npm registry to publish to
    default: https://registry.npmjs.org
    required: false
outputs:
  snapshot-id:
    description: ID of the generated snapshot
  package-name:
    description: Generated package name
  package-version:
    description: Generated package version
  tarball-url:
    description: URL of the generated package tarball
  integrity:
    description: SHA-512 integrity of the generated tarball
  agent-url:
    description: Kubb Studio agent URL
  registry:
    description: npm registry used for publishing
  published:
    description: Whether the snapshot was published to npm
runs:
  using: node24
  main: dist/index.js
